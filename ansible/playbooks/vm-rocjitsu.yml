---
- name: Bake rocjitsu prerequisites into a base VM image
  hosts: all
  gather_facts: true
  become: true
  vars:
    username: "{{ vm_username | default('ubuntu') }}"
    root_user: "{{ vm_root_user | default('ubuntu') }}"
    user_setup_motd: true
    user_setup_install_amd_ca: false
    user_setup_dotfiles_enable: true
    rocm_setup_user: "{{ vm_username | default('ubuntu') }}"
    rocm_setup_repo_stream: therock
    rocm_setup_minimal: true
    rocm_setup_minimal_packages:
      - libstdc++-14-dev
      - amdrocm-runtime-dev
    rocm_setup_skip_reboot: false
    rocm_setup_run_checks: true
    rocm_setup_run_gpu_checks: false
    rocm_setup_extra_kernel_packages:
      - linux-generic-hwe-26.04
    rocm_setup_install_metrics_exporter: true
  pre_tasks:
    - name: Pin ROCm-conflicting Ubuntu universe packages to never-install
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/rocm-no-distro-packages
        content: |
          Package: rocminfo
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: hipcc
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: rocm-smi-lib
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsakmt1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime64-1
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libhsa-runtime-dev
          Pin: release o=Ubuntu
          Pin-Priority: -1

          Package: libamdhip64-*
          Pin: release o=Ubuntu
          Pin-Priority: -1
        mode: '0644'
      become: true

    - name: Remove any partial dotfiles clone so user_setup can start fresh
      ansible.builtin.file:
        path: "/home/{{ username }}/.dotfiles"
        state: absent
      become: true

    - name: Remove stale ROCm GPG keyrings and sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/apt/keyrings/rocm.gpg
        - /etc/apt/keyrings/amdrocm.gpg
        - /etc/apt/sources.list.d/rocm.sources

    - name: Remove any stale device-metrics-exporter apt sources
      ansible.builtin.shell:
        cmd: |
          find /etc/apt/sources.list.d -type f \
            -exec grep -l "device-metrics-exporter\|amdgpu-exporter" {} \; \
            | xargs -r rm -f
      become: true
      changed_when: false

  roles:
    - role: sbates130272.batesste.user_setup
    - role: sbates130272.batesste.fave_packages
    - role: sbates130272.batesste.git_setup

  tasks:
    - name: Purge stale distro ROCm runtime packages
      ansible.builtin.package:
        name:
          - libhsakmt1
          - libhsa-runtime64-1
          - libhsa-runtime-dev
          - libamdhip64-7
          - libamdhip64-dev
        state: absent
        purge: true
      become: true

    - name: Blacklist amdgpu autoload
      ansible.builtin.copy:
        dest: /etc/modprobe.d/amdgpu-blacklist.conf
        content: "blacklist amdgpu\n"
        mode: '0644'
      become: true

    # Without this the blacklist silently does nothing on the first boot. The
    # initramfs is generated during cloud-init, before this play runs, so its
    # copy of /etc/modprobe.d has no blacklist in it and udev autoloads amdgpu
    # from the initramfs at ~4 s. At that point /lib/firmware is not the guest
    # root yet, so every firmware request fails with -2 and the probe dies:
    #
    #   amdgpu: Direct firmware load for amdgpu/psp_15_0_8_toc_1.bin failed with error -2
    #   amdgpu: Fatal error during GPU init
    #
    # which is doubly confusing because those files *are* present in the booted
    # guest. Worse, the wedged module cannot be recovered: rmmod segfaults and
    # a reload reports "Device or resource busy", so it costs a full reboot.
    #
    # Unconditional on purpose. Gating this on the blacklist task reporting
    # "changed" looks tidier but leaves an image whose /etc/modprobe.d is
    # already right and whose initramfs is still stale -- which is exactly the
    # broken state this fixes -- untouched on a re-run.
    - name: Rebuild initramfs so the amdgpu blacklist takes effect on first boot
      ansible.builtin.command:
        cmd: update-initramfs -u
      become: true
      changed_when: true

    - name: Create local temp dir for firmware generation
      ansible.builtin.tempfile:
        state: directory
        prefix: rj_fw_
      register: rj_fw_tmp
      delegate_to: localhost
      become: false

    - name: Generate gfx1250 firmware stubs on controller via rocjitsu container
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ rj_fw_tmp.path }}:/out
          {{ rocjitsu_image | default('sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:latest') }}
          python3 /usr/local/bin/vfio_guest_firmware.py --output /out
      delegate_to: localhost
      become: false

    - name: Generate ip_discovery.bin on controller via rocjitsu container
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v {{ rj_fw_tmp.path }}:/out
          {{ rocjitsu_image | default('sbates130272/batesste-ci-images-ubuntu-rocm-rocjitsu:latest') }}
          rj-ip-discovery gfx1250 /out/ip_discovery.bin
      delegate_to: localhost
      become: false

    - name: Copy firmware stubs to guest /lib/firmware/amdgpu/
      ansible.builtin.copy:
        src: "{{ rj_fw_tmp.path }}/"
        dest: /lib/firmware/amdgpu/
        mode: '0644'
      become: true

    - name: Clean up local firmware temp dir
      ansible.builtin.file:
        path: "{{ rj_fw_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false

    # The gc_12_1_0_mes.bin / gc_12_1_0_mes1.bin copies that used to be made
    # here are gone. They duplicated gc_12_1_0_uni_mes.bin under two other
    # names because the gfx12.1 path was believed to request the split
    # per-pipe MES images that vfio_guest_firmware.py does not generate.
    #
    # It does not. amdgpu sets enable_uni_mes for GC 12.1.0, so the only MES
    # image it asks for is gc_12_1_0_uni_mes.bin -- which the stub generator
    # already produces. Verified by deleting both copies from the guest and
    # probing on a clean stack: the GPU still comes up ("Topology: Add GPU
    # node [0x1002:0x75c1]", "kfd kfd: added device 1002:75c1") with no
    # firmware load failure of any kind.
    #
    # Note the copies were never a faithful stand-in anyway: uni_mes is a
    # unified-scheduler image, not two per-pipe images, so if the driver had
    # really wanted mes/mes1 it would have been handed the wrong shape.

    # The KFD atomics patch that used to live here is gone, along with the
    # DKMS rebuild it forced. It rewrote kfd_device.c so pci_atomic_requested
    # would also accept amdgpu_emu_mode == 1, because the emulated function
    # could not get PCIe AtomicOps enabled and KFD rejects a device without
    # them ("PCI rejects atomics").
    #
    # That was never a guest problem. Linux enables an AtomicOp requester in
    # pci_enable_atomic_ops_to_root(), which reads Device Capabilities 2 of
    # the *root port* above the endpoint, not the endpoint's own completer
    # bits. The device was attached straight to pcie.0, so it had no root
    # port at all and enumerated as a Root Complex Integrated Endpoint, which
    # is no longer an accepted requester type either. rocjitsu was already
    # advertising AtomicOpsCap: 32bit+ 64bit+ correctly; nothing was ever
    # going to read it.
    #
    # The fix is in the topology: qemu-tool now puts each vfio-user function
    # behind its own pcie-root-port with x-atomic-ops=on, so the root port
    # advertises 32- and 64-bit AtomicOp completion. With that in place an
    # unmodified distro amdgpu gets have_atomics_support=true and KFD accepts
    # the device, so the guest needs no patch and no DKMS rebuild.
    #
    # This requires a QEMU built with the pcie-root-port AtomicOp patch.

    # amdrocm-blas-dev alone gives you rocblas.h and no librocblas.so, so
    # anything that #includes rocBLAS compiles and then fails to link:
    #   ld.lld: error: unable to find library -lrocblas
    # The runtime library and the gfx1250 kernel bundle are separate packages.
    #
    # Note for anyone running a rocBLAS workload against the emulated part:
    # export ROCBLAS_USE_HIPBLASLT=0. rocBLAS 10.0 dispatches GEMM through
    # hipBLASLt, which allocates a 128 MB workspace at handle creation, and the
    # emulated device exposes 256 MB of which ~94 MB is free after the driver
    # takes its share. The failure is reported as
    #   Hip error: 'out of memory'(2) at .../hipblaslt.cpp:164
    # with nothing naming the workspace. The variable selects rocBLAS's own
    # Tensile path and the same binary passes.
    - name: Install rocBLAS (headers, host runtime and gfx1250 kernels)
      ansible.builtin.package:
        name:
          - amdrocm-blas-dev
          - amdrocm-blas-host10.0
          - amdrocm-blas10.0-gfx1250
        state: present
        update_cache: false
      become: true

    - name: Install amdgpu probe script
      ansible.builtin.copy:
        dest: /usr/local/bin/amdgpu-probe
        mode: '0755'
        content: |
          #!/bin/bash
          # Probe amdgpu with gfx1250 emulation parameters.
          # Run after rocjitsu vfio-user server is ready.
          exec sudo modprobe amdgpu \
            emu_mode=1 \
            fw_load_type=0 \
            discovery=2 \
            ip_block_mask=0x3f \
            vm_update_mode=3 \
            gpu_recovery=0 \
            vramlimit=256
      become: true

    # The device-metrics-exporter repo has no resolute suite yet; pin to noble.
    - name: Add device-metrics-exporter apt source (noble suite)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/device-metrics-exporter.sources
        content: |
          Types: deb
          URIs: https://repo.radeon.com/device-metrics-exporter/apt/1.5.1
          Suites: noble
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/rocm.gpg
        mode: '0644'
      become: true

    - name: Install AMD Device Metrics Exporter
      ansible.builtin.package:
        name: amdgpu-exporter
        state: present
        update_cache: true
      become: true
